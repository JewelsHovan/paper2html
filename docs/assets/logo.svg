<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">paper2html logo</title>
  <desc id="desc">A research paper page with an equation and figure, turning into HTML brackets and a play button.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8edfb"/>
    </linearGradient>
  </defs>

  <!-- Rounded tile keeps the mark legible on light and dark backgrounds. -->
  <rect x="4" y="4" width="152" height="152" rx="34" fill="url(#bg)"/>

  <!-- The paper, tilted slightly as if mid-transformation. -->
  <g transform="rotate(-8 70 80)">
    <path d="M38 30 h52 l20 20 v74 a6 6 0 0 1 -6 6 h-66 a6 6 0 0 1 -6 -6 v-88 a6 6 0 0 1 6 -6 z" fill="url(#page)"/>
    <path d="M90 30 v14 a6 6 0 0 0 6 6 h14 z" fill="#c7d2fe"/>
    <text x="44" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-style="italic" fill="#1e3a8a">∑</text>
    <rect x="62" y="52" width="34" height="5" rx="2.5" fill="#94a3b8"/>
    <rect x="62" y="62" width="26" height="5" rx="2.5" fill="#94a3b8"/>
    <!-- A tiny bar chart: the original figures come along. -->
    <rect x="44" y="78" width="54" height="30" rx="4" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
    <rect x="51" y="94" width="7" height="10" rx="1.5" fill="#f59e0b"/>
    <rect x="62" y="87" width="7" height="17" rx="1.5" fill="#10b981"/>
    <rect x="73" y="83" width="7" height="21" rx="1.5" fill="#6366f1"/>
    <rect x="84" y="90" width="7" height="14" rx="1.5" fill="#ec4899"/>
    <rect x="44" y="114" width="40" height="5" rx="2.5" fill="#94a3b8"/>
  </g>

  <!-- HTML badge. -->
  <g transform="translate(96 92)">
    <circle cx="22" cy="22" r="24" fill="#f59e0b" stroke="#ffffff" stroke-width="4"/>
    <path d="M14 15 l-7 7 l7 7 M30 15 l7 7 l-7 7" fill="none" stroke="#1e1b4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M25 12 l-6 20" fill="none" stroke="#1e1b4b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Narrated-video badge. -->
  <g transform="translate(108 18)">
    <circle cx="16" cy="16" r="17" fill="#ec4899" stroke="#ffffff" stroke-width="3.5"/>
    <path d="M12 9 l11 7 l-11 7 z" fill="#ffffff"/>
  </g>
</svg>
